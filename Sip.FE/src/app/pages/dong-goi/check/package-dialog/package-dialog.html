<!-- Form điền thông tin đóng gói -->
<p-dialog
  [(visible)]="visible"
  [modal]="true"
  [draggable]="false"
  [resizable]="false"
  [closable]="!packing()"
  [style]="{ width: '36rem' }"
  header="Đóng gói hồ sơ SIP"
>
  <div class="flex flex-col gap-4 pt-2">
    <!-- Thư mục hồ sơ (read-only) -->
    <div class="flex flex-col gap-1">
      <label class="font-medium text-slate-700">Thư mục hồ sơ</label>
      <input pInputText [value]="folderPath()" readonly class="w-full bg-slate-50 text-slate-500" />
    </div>

    <div class="flex flex-col gap-1">
      <label class="font-medium text-slate-700">Mã phông</label>
      <input
        pInputText
        class="w-full"
        placeholder="VD: P_KHCN"
        [ngModel]="maPhong()"
        (ngModelChange)="maPhong.set($event)"
      />
    </div>

    <div class="flex flex-col gap-1">
      <label class="font-medium text-slate-700">Người tạo</label>
      <input
        pInputText
        class="w-full"
        placeholder="Nhập tên người tạo"
        [ngModel]="nguoiTao()"
        (ngModelChange)="nguoiTao.set($event)"
      />
    </div>

    <div class="flex flex-col gap-1">
      <label class="font-medium text-slate-700">Thư mục xuất (tuỳ chọn)</label>
      <div class="flex items-center gap-2">
        <input
          pInputText
          class="w-full flex-1"
          placeholder="Để trống = tạo cùng cấp với thư mục hồ sơ"
          [ngModel]="outputPath()"
          (ngModelChange)="outputPath.set($event)"
          [readonly]="desktop.isDesktop"
        />
        @if (desktop.isDesktop) {
          <p-button icon="pi pi-folder-open" severity="secondary" [outlined]="true" (onClick)="chooseOutput()" />
        }
      </div>
    </div>
  </div>

  <ng-template pTemplate="footer">
    <p-button label="Hủy" severity="secondary" [text]="true" [disabled]="packing()" (onClick)="onCancel()" />
    <p-button label="Đóng gói" icon="pi pi-box" severity="success" [loading]="packing()" (onClick)="onSubmit()" />
  </ng-template>
</p-dialog>

<!-- Popup đóng gói thành công -->
<p-dialog
  [(visible)]="showSuccess"
  [modal]="true"
  [draggable]="false"
  [resizable]="false"
  [style]="{ width: '36rem' }"
  header="Đóng gói thành công"
>
  @if (result(); as r) {
    <div class="flex flex-col gap-3 pt-2">
      <div class="flex items-center gap-2 text-green-600">
        <i class="pi pi-check-circle text-2xl"></i>
        <span class="font-medium">Đã đóng gói {{ r.totalDoc }} tài liệu thành công.</span>
      </div>

      <div class="flex flex-col gap-1 text-sm">
        <span class="text-slate-500">Mã hồ sơ: <span class="text-slate-800">{{ r.fileCode }}</span></span>
        <span class="text-slate-500">Mã gói (OBJID): <span class="text-slate-800 break-all">{{ r.objid }}</span></span>
      </div>

      <div class="flex flex-col gap-1">
        <span class="font-medium text-slate-700">File ZIP (bấm để mở):</span>
        <button
          type="button"
          class="text-left text-indigo-600 hover:underline break-all"
          (click)="openFolder(r.zipPath)"
        >
          <i class="pi pi-file-export mr-1"></i>{{ r.zipPath }}
        </button>
      </div>

      @if (r.warnings.length) {
        <div class="rounded border border-amber-200 bg-amber-50 p-2 text-sm text-amber-700">
          <div class="mb-1 font-medium">Cảnh báo:</div>
          <ul class="list-disc pl-5">
            @for (w of r.warnings; track w) {
              <li>{{ w }}</li>
            }
          </ul>
        </div>
      }
    </div>
  }

  <ng-template pTemplate="footer">
    <p-button label="Đóng" (onClick)="closeSuccess()" />
  </ng-template>
</p-dialog>
