<!-- Form nhập thông tin ký số -->
<p-dialog
  [(visible)]="visible"
  [modal]="true"
  [draggable]="false"
  [resizable]="false"
  [style]="{ width: '34rem' }"
  header="Thông tin ký số"
>
  <div class="flex flex-col gap-4 pt-2">
    <div class="flex flex-col gap-1">
      <label class="font-medium text-slate-700">Lý do ký</label>
      <input
        pInputText
        class="w-full"
        placeholder="Để trống = dùng lý do mặc định của hệ thống"
        [ngModel]="reason()"
        (ngModelChange)="reason.set($event)"
      />
    </div>

    <div class="flex flex-col gap-1">
      <label class="font-medium text-slate-700">Nơi ký</label>
      <input
        pInputText
        class="w-full"
        placeholder="Để trống = dùng nơi ký mặc định của hệ thống"
        [ngModel]="location()"
        (ngModelChange)="location.set($event)"
      />
    </div>
  </div>

  <ng-template pTemplate="footer">
    <p-button label="Huỷ" severity="secondary" [text]="true" (onClick)="onCancel()" />
    <p-button label="Bắt đầu" icon="pi pi-pencil" (onClick)="onStart()" />
  </ng-template>
</p-dialog>
