<p-dialog
  [(visible)]="visible"
  [modal]="true"
  [draggable]="false"
  [resizable]="false"
  [style]="{ width: '30rem' }"
  [breakpoints]="{ '640px': '92vw' }"
  header="Xác nhận cấu hình chữ ký"
>
  <p class="text-base text-slate-700">
    Bạn có chắc chắn muốn áp dụng cấu hình chữ ký này để ký số không?
  </p>

  <ng-template pTemplate="footer">
    <div class="flex w-full items-center justify-end gap-3">
      <p-button
        label="Hủy"
        severity="secondary"
        [outlined]="true"
        styleClass="w-32 justify-center"
        (onClick)="onCancel()"
      />
      <p-button label="Lưu" icon="pi pi-check" styleClass="w-32 justify-center" (onClick)="onSave()" />
    </div>
  </ng-template>
</p-dialog>
