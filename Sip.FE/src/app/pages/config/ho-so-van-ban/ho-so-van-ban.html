<div class="flex flex-col gap-4">
  <div class="flex items-center gap-2">
    <label class="font-medium">Loại cấu hình:</label>
    <p-select
      [options]="options"
      [ngModel]="selected()"
      optionLabel="label"
      optionValue="value"
      placeholder="Chọn loại cấu hình"
      (onChange)="selected.set($event.value); onSelect()"
    />
  </div>

  <app-data-table
    [columns]="columns"
    [data]="rows()"
    [loading]="tableLoading()"
    [hidePaginator]="true"
    [pageSize]="rows().length"
  />
</div>
