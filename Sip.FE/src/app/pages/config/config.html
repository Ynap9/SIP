<div class="flex min-h-0 flex-1 flex-col gap-4">
  <app-breadcrumb [home]="home" [items]="breadcrumbItems" />

  <p-selectbutton
    [options]="tabOptions"
    [ngModel]="tab()"
    optionLabel="label"
    optionValue="value"
    [allowEmpty]="false"
    (onChange)="onTabChange($event.value)"
  />

  <router-outlet />
</div>
